game: hex5
iterations: 20
debug: false
working_area: "{CATTUS_TRAIN_TOP}/workarea/{GAME_NAME}"

model:
    base: null
    type: ConvNetV1
    residual_block_num: 7
    residual_filter_num: 16
    value_head_conv_output_channels_num: 16
    policy_head_conv_output_channels_num: 16

engine:
    mcts:
        sim_num: 10
        explore_factor: 1.41421
        temperature_policy:
            - [9999, 0.0]
        prior_noise_alpha: 0.4
        prior_noise_epsilon: 0.25
        cache_size: 1000000
    model:
        batch_size: 4
        inference:
            engine: onnx-ort
    threads: 8

self_play:
    engine_overrides:
        mcts:
            temperature_policy:
                - [10, 1.0]
                - [9999, 0.0]
    games_num: 200

    model_compare:
        games_num: 20
        switching_winning_threshold: 0.55
        warning_losing_threshold: 0.55

training:
    latest_data_entries: 24000
    epoch_size: 10000
    batch_size: 64
    learning_rate:
        - [5, 0.01]
        - [10, 0.001]
        - [0.0001]
    weight_decay: 0.0001
    use_train_data_across_runs: false
    device: null
