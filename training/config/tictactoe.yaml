game: "tictactoe"
iterations: 30
model_num: 4
debug: false
working_area: "{CATTUS_TRAIN_TOP}/workarea/{GAME_NAME}"

model:
    base: "[none]"
    type: "ConvNetV1"
    residual_block_num: 5
    residual_filter_num: 8
    value_head_conv_output_channels_num: 8
    policy_head_conv_output_channels_num: 8

engine:
    mcts:
        sim_num: 300
        explore_factor: 1.41421
        temperature_policy:
            - [9999, 0.0]
        prior_noise_alpha: 0.03
        prior_noise_epsilon: 0.25
        cache_size: 1000000
    model:
        batch_size: 4
        inference:
            engine: onnx-ort
    threads: 8

self_play:
    engine_overrides:
        mcts:
            temperature_policy:
                - [3, 1.0]
                - [9999, 0.0]
    games_num: 40
    model_compare:
        games_num: 30
        switching_winning_threshold: 0.55
        warning_losing_threshold: 0.55

training:
    latest_data_entries: 1440
    epoch_size: 360
    batch_size: 32
    learning_rate:
        - [10, 0.01]
        - [20, 0.001]
        - [0.0001]
    # l2reg: 0.0001
    use_train_data_across_runs: true
    threads: 4
    device: null
