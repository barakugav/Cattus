[package]
name = "cattus"
version = "0.1.0"
edition = "2024"


[dependencies]
log = "0.4"
env_logger = "0.11"
itertools = "0.14"
rand = "0.10"
rand_distr = "0.6"
lazy_static = "1.5.*"
petgraph = "0.8"
clap = { version = "4.6", features = ["derive"] }
ndarray = "0.16"
chess = "3.2.*"
num-traits = "0.2"
metrics = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-utils = "0.8.4"


# Optional dependencies for model inference
pyo3 = { version = "0.27", features = ["auto-initialize"], optional = true }
numpy = { version = "0.27", default-features = false, optional = true }
tract-onnx = { version = "0.22", optional = true }
ort = { version = "=2.0.0-rc.10", optional = true }
executorch = { version = "0.8", features = [
    "module",
    "tensor-ptr",
], optional = true }
executorch-sys = { version = "0.8", default-features = false, optional = true }
pleco = { version = "0.5.*", optional = true }
torch = { package = "tch", version = "0.22", default-features = false, optional = true }


[features]
default = []
torch-python = ["pyo3", "numpy"]
torch-tch-rs = ["torch"]
onnx-tract = ["tract-onnx"]
onnx-ort = ["ort"]
# Execution providers for the ort backend. Since rc.13 the EP types only exist when ort's own
# feature is on, and that feature set also decides which prebuilt ONNX Runtime gets downloaded —
# so enabling cuda/tensorrt pulls a much larger CUDA 13 + TensorRT build. Enable none of them for
# the CPU provider.
onnx-ort-cuda = ["onnx-ort", "ort/cuda"]
onnx-ort-tensorrt = ["onnx-ort", "ort/tensorrt"]
onnx-ort-coreml = ["onnx-ort", "ort/coreml"]
executorch = ["dep:executorch", "executorch-sys"]
stockfish = ["pleco"]


[[bin]]
name = "cattus"
path = "src/bin/cattus.rs"
required-features = ["stockfish"]
