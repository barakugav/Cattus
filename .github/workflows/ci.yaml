name: CI

on:
  push:
    branches:
      - main
  pull_request: {} # on any branch

concurrency:
  # on main, group = workflow-run_id
  # on PR, group = workflow-PR_number
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cattus:
    runs-on: ubuntu-latest
    # Every backend, minus the `onnx-ort-*` execution providers. Those pick which prebuilt ONNX
    # Runtime ort downloads, and none of them fit a GPU-less Linux runner: CUDA/TensorRT would pull
    # a far larger build, and CoreML doesn't exist on Linux. They get type-checked on their own
    # further down instead, which is why these lists are spelled out rather than --all-features.
    env:
      ENGINE_FEATURES: torch-python,torch-tch-rs,onnx-tract,onnx-ort,executorch,stockfish
      SELF_PLAY_FEATURES: torch-python,torch-tch-rs,onnx-tract,onnx-ort,executorch
    permissions:
      contents: read
      checks: write
    steps:
      # Setup
      - name: Get repo
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          python-version: 3.12
          activate-environment: true
      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0
          components: clippy
          cache-workspaces: |
            engine
            training/self-play
      - name: Install Python dependencies
        run: python etc/install_python_requirements.py

      # Build executorch
      - name: Cache Cpp ExecuTorch compiled libraries
        id: cache-executorch-build
        uses: actions/cache@v6
        with:
          path: engine/third-party/executorch/build/
          key: cache-executorch-build-${{ runner.OS }}-${{ hashFiles('engine/scripts/build_executorch.py') }}
      - name: Setup dev env, install executorch and its deps
        if: steps.cache-executorch-build.outputs.cache-hit != 'true'
        run: python engine/scripts/build_executorch.py

      # Download libtorch
      - name: Download libtorch
        run: python engine/scripts/download_libtorch.py

      # Engine
      - name: Build Rust
        run: cargo build --features $ENGINE_FEATURES
        working-directory: engine
      - name: Rust Clippy linter
        uses: auguwu/clippy-action@1.5.0
        with:
          working-directory: engine
          check-args: --features ${{ env.ENGINE_FEATURES }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rust tests
        run: |
          source .envrc
          cargo test --features $ENGINE_FEATURES
        working-directory: engine
      - name: Rust Clippy linter for examples
        uses: auguwu/clippy-action@1.5.0
        with:
          working-directory: engine
          check-args: --features ${{ env.ENGINE_FEATURES }} --examples
          token: ${{ secrets.GITHUB_TOKEN }}
      # Type-checks the execution provider code paths without downloading any ONNX Runtime:
      # ORT_SKIP_DOWNLOAD makes ort defer the missing-library error to link time, which clippy
      # never reaches.
      - name: Rust Clippy linter for ort execution providers
        uses: auguwu/clippy-action@1.5.0
        env:
          ORT_SKIP_DOWNLOAD: 1
        with:
          working-directory: engine
          check-args: --features onnx-ort,onnx-ort-cuda,onnx-ort-tensorrt,onnx-ort-coreml --all-targets
          token: ${{ secrets.GITHUB_TOKEN }}

      # Self-play crate
      - name: Build Rust
        run: cargo build --features $SELF_PLAY_FEATURES
        working-directory: training/self-play
      - name: Rust Clippy linter
        uses: auguwu/clippy-action@1.5.0
        with:
          working-directory: training/self-play
          check-args: --features ${{ env.SELF_PLAY_FEATURES }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Training package
      - name: Python Ruff linter
        uses: astral-sh/ruff-action@v3
        with:
          args: check --config training/ruff.toml training
          version: 0.16.x

      - name: Python tests
        run: pytest -s tests
        working-directory: training
