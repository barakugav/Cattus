[env]
EXECUTORCH_RS_EXECUTORCH_LIB_DIR = { value = "engine/third-party/executorch/build/", relative = true }
MACOSX_DEPLOYMENT_TARGET = "12.0"
LIBTORCH = { value = "engine/third-party/libtorch", relative = true }
LIBTORCH_BYPASS_VERSION_CHECK = "1" # tch-rs expect torch 2.9.0, but latest is 2.9.1

[profile.profiling]
inherits = "release"
debug = true
